<body>
<section class="booking-page" >
<div class="background"></div>

        <div class="booking-form">
        
            <h2>Table Booking Form</h2>
            <form>

                <label for="name">Họ và Tên:</label>
                <input type="text" id="name" name="name" placeholder="Nguyen Van A" required>
                      
                <label for="phone">Số Điện Thoại:</label>
                <input type="tel" id="phone" name="phone" placeholder="Phone Number" required>
       
                <label for="address">Địa chỉ:</label>
                <input type="text" id="address" name="address" placeholder="Stress A, City B" required>

                <label for="date">Ngày Đặt:</label>
                <input type="date" id="date" name="date" required>
              
                <label for="start-time">Giờ Đặt:</label>
                <input type="time" id="start-time" name="start-time" required>       

                <label for="selectedTable">Bàn đã chọn:</label>
                <input type="text" id="selectedTable" name="table" readonly>
                  
            <button type="submit" class="booking-button">Xác Nhận Đặt Bàn</button>
            
            </form>
        </div>

</section>
<script>
document.addEventListener("input", function() {
    let name = document.getElementById("name").value;
    let date = document.getElementById("date").value;
    let start_time = document.getElementById("start-time").value;
    let phone = document.getElementById("phone").value;
    let address = document.getElementById("address").value;
    let end_time = document.getElementById("end-time").value;


    document.querySelector(".booking-button").disabled = !(name && date && start_time && phone && address && end_time);

    document.querySelector(".booking-button").addEventListener("click", function(event) {
    event.preventDefault(); // Ngăn form tải lại trang ngay lập tức
    window.location.href = "done.html";
    });
    const closeButton = document.querySelector(".form-cancel");
    closeButton.addEventListener("click", function() {
       window.location.href = 'table.html'; // Ẩn form đặt bàn
    });
});
    


</script>
