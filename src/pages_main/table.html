<main>
    <div class="background-table"></div>

    <h1>Chọn bàn để đặt</h1>
    <div class="booking-container">
        <a href="form.html" class="table available" data-table="Bàn 1" id="table-1">Bàn 1</a>
        <a href="form.html" class="table available" data-table="Bàn 2" id="table-2">Bàn 2</a>
        <a href="form.html" class="table booked" data-table="Bàn 3" id="table-3">Bàn 3</a>
        <a href="form.html" class="table available" data-table="Bàn 4"  id="table-4">Bàn 4</a>
        <a href="form.html" class="table booked" data-table="Bàn 5" id="table-5">Bàn 5</a>
        <a href="form.html" class="table available" data-table="Bàn 6" id="table-6">Bàn 6</a>
    </div>
</main>

<script>
const bookedTables = ["table-3", "table-5"]; // Danh sách bàn đã đặt

document.querySelectorAll(".table").forEach(table => {
  if (bookedTables.includes(table.id)) {
    table.classList.add("booked");
    table.removeAttribute("href"); // Không cho đặt lại
  }
});
    table.addEventListener("click", function() {
        if (!this.classList.contains("booked")) {
        const selectedTable = this.getAttribute("data-table");
        localStorage.setItem("selectedTable", selectedTable);
        window.location.href = "form.html"; // Chuyển đến trang đặt bàn
        }
    });
document.addEventListener("DOMContentLoaded", function() {
    const selectedTable = localStorage.getItem("selectedTable");
    if (selectedTable) {
        document.getElementById("selectedTable").value = selectedTable;
    }
});

document.querySelectorAll(".table.available").forEach(table => {
    table.addEventListener("click", function() {
        const tableName = this.getAttribute("data-table");
        localStorage.setItem("selectedTable", tableName);
        window.location.href = "form.html";
    });
});



</script>
